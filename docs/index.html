<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="board-wrap">
      <svg id="board" role="img" aria-label="Go board"></svg>
    </section>

    <aside class="panel">
      <h1>Go board</h1>

      <label class="field">
        <span>Game</span>
        <select id="game-select"></select>
      </label>

      <dl class="info">
        <div><dt><span class="dot black"></span>Black</dt><dd id="pb">–</dd></div>
        <div><dt><span class="dot white"></span>White</dt><dd id="pw">–</dd></div>
        <div><dt>Komi</dt><dd id="komi">–</dd></div>
        <div><dt>Result</dt><dd id="result">–</dd></div>
        <div><dt>Captures</dt><dd id="caps">–</dd></div>
      </dl>

      <p id="status" class="status" aria-live="polite"></p>

      <div class="controls">
        <button id="first" title="First move (Home)">⏮</button>
        <button id="prev" title="Previous move (←)">◀</button>
        <button id="next" title="Next move (→)">▶</button>
        <button id="last" title="Last move (End)">⏭</button>
      </div>
      <input id="slider" type="range" min="0" max="0" value="0" aria-label="Move number">

      <div class="controls">
        <button id="pass">Pass</button>
        <button id="back-to-game" hidden>Back to game</button>
        <button id="clear">Empty board</button>
      </div>

      <p class="hint">Click the board to play the next move. Playing off the recorded game starts your own line; “Back to game” returns to the record.</p>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
